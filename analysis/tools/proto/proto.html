<script type="module">
import '@angular/compiler';
import {DefaultUrlSerializer} from '@angular/router';
import {HttpParams} from '@angular/common/http';

const hasil=[];
function cek(label, jalankan, sondir){
  // Sondir dipilih unik supaya tidak bentrok antar-kasus.
  let keluaran=null, galat=null;
  try { keluaran = jalankan(); } catch(e){ galat = String(e.message||e); }
  const tercemar = ({})[sondir];
  hasil.push({
    label,
    galat,
    keluaran: keluaran===null?null:JSON.stringify(keluaran).slice(0,160),
    sondir,
    prototipeTercemar: tercemar !== undefined ? String(tercemar) : 'TIDAK',
  });
}

const S=new DefaultUrlSerializer();

cek('router query  ?__proto__[p1]=x',
    ()=>{const t=S.parse('/a?__proto__[p1]=x'); return t.queryParams;}, 'p1');
cek('router query  ?__proto__=x',
    ()=>{const t=S.parse('/a?__proto__=x'); return t.queryParams;}, 'p2');
cek('router matrix /a;__proto__=x',
    ()=>{const t=S.parse('/a;__proto__=x'); let g=t.root.children['primary']; return g.segments.map(s=>s.parameters);}, 'p3');
cek('router matrix /a;constructor=x',
    ()=>{const t=S.parse('/a;constructor=x'); let g=t.root.children['primary']; return g.segments.map(s=>s.parameters);}, 'p4');
cek('HttpParams fromString __proto__[p5]=x',
    ()=>{const p=new HttpParams({fromString:'__proto__[p5]=x'}); return p.toString();}, 'p5');
cek('HttpParams fromString __proto__=x',
    ()=>{const p=new HttpParams({fromString:'__proto__=x'}); return {v:p.get('__proto__')};}, 'p6');

// Kontrol positif: pastikan sondir MEMANG dapat mendeteksi pencemaran.
cek('KONTROL POSITIF (sengaja mencemari)',
    ()=>{ const o={}; o['__proto__']=undefined; Object.setPrototypeOf({}, Object.prototype);
          // pencemaran nyata lewat literal:
          ({}).__proto__['pZZ']='TERCEMAR'; return 'dicemari'; }, 'pZZ');

window.__PROTO__=hasil;
document.getElementById('o').textContent=JSON.stringify(hasil,null,1);

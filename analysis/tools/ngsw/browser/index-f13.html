<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>F-13 — Angular Service Worker memaksa ignoreVary: true</title>
<style>
 body{font:13.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;margin:22px;max-width:960px}
 h1{font-size:17px;margin:0 0 2px}
 .sub{color:#555;margin:0 0 14px}
 table{border-collapse:collapse;width:100%;margin-top:10px}
 td,th{border:1px solid #bbb;padding:6px 9px;text-align:left;vertical-align:top}
 th{background:#f4f4f4}
 .bad{background:#ffe1e1}
 .ok{background:#e8f6e8}
 .box{padding:9px 11px;margin-top:12px;white-space:pre-wrap}
 code{background:#f2f2f2;padding:1px 4px}
 h2{font-size:14px;margin:18px 0 2px}
 #sw{color:#333;margin-bottom:6px}
</style>
</head>
<body>
<h1>F-13 — Angular Service Worker memaksa <code>ignoreVary: true</code></h1>
<p class="sub">Same-origin. Endpoint di bawah ini <b>sengaja</b> dicakup oleh <code>dataGroups</code> aplikasi.</p>
<div id="sw">status service worker: belum didaftarkan</div>
<div id="hasil"></div>

<script>
window.__daftarkanSW = async function () {
  try {
    if (!('serviceWorker' in navigator)) {
      return {ok: false, pesan: 'serviceWorker tidak tersedia (konteks tidak aman?)'};
    }
    await navigator.serviceWorker.register('/ngsw-worker.js', {scope: '/'});
    await navigator.serviceWorker.ready;

    // Tunggu sampai worker BENAR-BENAR mengendalikan halaman ini. Tanpa ini,
    // permintaan pertama tidak lewat SW dan seluruh uji jadi no-op yang tampak
    // "aman".
    if (!navigator.serviceWorker.controller) {
      await new Promise((res, rej) => {
        const t = setTimeout(() => rej(new Error('tidak pernah mengendalikan halaman')), 15000);
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          clearTimeout(t);
          res();
        });
      });
    }

    // Driver ngsw menginisialisasi diri secara asinkron (unduh ngsw.json,
    // bangun AppVersion). Tunggu manifestnya benar-benar termuat.
    for (let i = 0; i < 40; i++) {
      const r = await fetch('/ngsw/state', {cache: 'no-store'})
        .then((x) => x.text())
        .catch(() => '');
      if (/Latest manifest hash: [0-9a-f]{8}/.test(r)) {
        document.getElementById('sw').textContent =
          'status service worker: aktif, mengendalikan halaman, manifest termuat';
        return {ok: true};
      }
      await new Promise((r2) => setTimeout(r2, 150));
    }
    return {ok: false, pesan: 'SW aktif tetapi manifest tidak pernah termuat'};
  } catch (e) {
    return {ok: false, pesan: e.message};
  }
};

window.__ambil = async function (url, token) {
  const res = await fetch(url, {
    cache: 'no-store',
    headers: {Authorization: 'Bearer ' + token},
  });
  return {status: res.status, body: await res.text(), vary: res.headers.get('Vary')};
};

/**
 * Menyematkan sebabnya pada ENTRI CACHE YANG SAMA: entri yang barusan ditulis
 * ngsw dicocokkan dua kali dengan permintaan Bob — sekali dengan
 * {ignoreVary:true} (yang dipakai ngsw) dan sekali dengan default peramban
 * yang menghormati Vary.
 */
window.__ujiVary = async function (url) {
  const reqBob = new Request(url, {headers: {Authorization: 'Bearer BOB'}});
  for (const nama of await caches.keys()) {
    const c = await caches.open(nama);
    if (!(await c.keys()).some((r) => r.url === url)) continue;
    const abaikan = await c.match(reqBob, {ignoreVary: true});
    const hormati = await c.match(reqBob);
    return {
      cache: nama,
      denganIgnoreVaryTrue: abaikan ? await abaikan.text() : null,
      denganDefaultPeramban: hormati ? await hormati.text() : null,
    };
  }
  return null;
};

window.__lapor = function (d) {
  const esc = (s) =>
    String(s).replace(/[&<>]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'})[c]);
  const bocor = d.bob.body === d.alice.body;
  document.getElementById('hasil').innerHTML =
    '<h2>Permintaan</h2><table>' +
    '<tr><th></th><th>Authorization</th><th>URL</th><th>body yang diterima</th></tr>' +
    '<tr><td>T0 Alice</td><td><code>Bearer ALICE</code></td><td><code>' +
    esc(d.url) + '</code></td><td>' + esc(d.alice.body) + '</td></tr>' +
    '<tr class="' + (bocor ? 'bad' : 'ok') + '"><td>T2 Bob</td><td><code>Bearer BOB</code></td>' +
    '<td><code>' + esc(d.url) + '</code></td><td>' + esc(d.bob.body) + '</td></tr>' +
    '</table>' +
    '<div class="box ' + (bocor ? 'bad' : 'ok') + '">' +
    'Header respons server            : Vary: ' + esc(d.alice.vary) + '\n' +
    'Permintaan yang sampai ke server : ' + d.hitServer + '  (2 = normal, 1 = Bob dari cache)\n' +
    'Manifest ngsw.json               : "cacheQueryOptions": ' + esc(d.cqo) + '\n' +
    'Tipe konfigurasi publik          : Pick&lt;CacheQueryOptions, \'ignoreSearch\'&gt;' +
    '   (ignoreVary tidak dapat dipilih)' +
    '</div>' +
    '<h2>Pencocokan pada entri cache yang SAMA</h2><div class="box">' +
    'cache.match(bobRequest)                      -> ' +
    esc(d.uji ? (d.uji.denganDefaultPeramban ?? 'undefined  (default peramban menegakkan Vary)') : '-') +
    '\n' +
    'cache.match(bobRequest, {ignoreVary: true})  -> ' +
    esc(d.uji ? (d.uji.denganIgnoreVaryTrue ?? 'undefined') : '-') +
    '   <-- yang dipakai Angular' +
    '</div>' +
    '<div class="box ' + (bocor ? 'bad' : 'ok') + '">' +
    (bocor
      ? 'Server menyatakan representasi ini bervariasi menurut header Authorization. Peramban akan MENOLAK respons Alice untuk permintaan Bob. Angular menimpa keputusan itu dengan ignoreVary: true, dan permintaan Bob tidak pernah mencapai server.'
      : 'Permintaan Bob mencapai server dan ia menerima datanya sendiri.') +
    '</div>';
};
</script>
</body>
</html>
